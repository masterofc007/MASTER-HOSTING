<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0a0a0f">
<title>MASTER HOSTING — Login</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Cinzel:wght@600;700;900&family=Orbitron:wght@500;700;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
<style>
    :root {
        --gold-1: #fcd34d;
        --gold-2: #fbbf24;
        --gold-3: #d97706;
        --gold-4: #b45309;
        --black-1: #0a0a0f;
        --black-2: #14141c;
        --black-3: #1f1f2e;
        --text-1: #fff8e7;
        --text-2: #c4a86b;
        --text-3: #786740;
        --line-gold: rgba(251, 191, 36, 0.25);
        --line-gold-strong: rgba(251, 191, 36, 0.55);
    }
    * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html, body { height: 100dvh; overflow: hidden; }
    body {
        font-family: 'Inter', system-ui, sans-serif;
        background: var(--black-1);
        color: var(--text-1);
        display: flex; align-items: center; justify-content: center;
        padding: 16px;
        position: relative;
        background:
            radial-gradient(ellipse 80% 60% at 50% 0%, rgba(251, 191, 36, 0.14), transparent 60%),
            radial-gradient(ellipse 60% 50% at 50% 100%, rgba(217, 119, 6, 0.08), transparent 60%),
            var(--black-1);
    }
    .bg-grid {
        position: fixed; inset: 0; z-index: 0;
        background-image:
            linear-gradient(rgba(251, 191, 36, 0.05) 1px, transparent 1px),
            linear-gradient(90deg, rgba(251, 191, 36, 0.05) 1px, transparent 1px);
        background-size: 56px 56px;
        mask-image: radial-gradient(ellipse at 50% 40%, #000 30%, transparent 75%);
        -webkit-mask-image: radial-gradient(ellipse at 50% 40%, #000 30%, transparent 75%);
        pointer-events: none;
    }
    #bgParticles {
        position: fixed; inset: 0; z-index: 0;
        pointer-events: none; opacity: 0.5;
    }
    .aurora {
        position: fixed; top: -50%; left: -20%;
        width: 140vw; height: 100vh;
        background:
            radial-gradient(circle at 30% 30%, rgba(251, 191, 36, 0.18), transparent 50%),
            radial-gradient(circle at 70% 60%, rgba(217, 119, 6, 0.12), transparent 50%);
        filter: blur(70px); pointer-events: none; z-index: 0;
        animation: aurora 18s ease-in-out infinite alternate;
    }
    @keyframes aurora {
        0% { transform: translate(0, 0) scale(1); }
        100% { transform: translate(-5%, 5%) scale(1.15); }
    }
    .login-box {
        width: 100%; max-width: 420px;
        padding: 40px 32px;
        border-radius: 24px;
        background: linear-gradient(160deg, rgba(35, 28, 15, 0.85), rgba(15, 12, 6, 0.92));
        backdrop-filter: blur(24px);
        -webkit-backdrop-filter: blur(24px);
        border: 1px solid var(--line-gold);
        box-shadow:
            0 30px 80px rgba(0, 0, 0, 0.7),
            0 0 60px rgba(251, 191, 36, 0.15),
            inset 0 1px 0 rgba(255, 255, 255, 0.05);
        text-align: center;
        position: relative;
        z-index: 10;
        animation: loginIn 0.8s cubic-bezier(.4, 0, .2, 1);
    }
    @keyframes loginIn {
        from { opacity: 0; transform: translateY(20px) scale(0.98); }
        to   { opacity: 1; transform: none; }
    }
    .brand-badge {
        display: inline-flex; align-items: center; gap: 8px;
        padding: 6px 14px;
        background: rgba(251, 191, 36, 0.12);
        color: var(--gold-2);
        border-radius: 20px;
        font-size: 10px; font-weight: 800; letter-spacing: 2px;
        margin-bottom: 22px;
        border: 1px solid var(--line-gold-strong);
        text-transform: uppercase;
    }
    .brand-logo {
        font-family: 'Cinzel', serif;
        font-size: 38px; font-weight: 900; line-height: 1.05;
        letter-spacing: -0.5px;
        margin-bottom: 8px;
        background: linear-gradient(135deg, #fff8e7 0%, var(--gold-1) 40%, var(--gold-3) 100%);
        -webkit-background-clip: text; background-clip: text;
        -webkit-text-fill-color: transparent;
        filter: drop-shadow(0 0 20px rgba(251, 191, 36, 0.3));
    }
    .brand-logo span {
        display: block;
        font-size: 22px;
        letter-spacing: 6px;
        font-family: 'Orbitron', sans-serif;
        font-weight: 700;
        background: linear-gradient(135deg, var(--gold-2), var(--gold-4));
        -webkit-background-clip: text; -webkit-text-fill-color: transparent;
        margin-top: 4px;
    }
    .subtitle {
        color: var(--text-2); font-size: 13px;
        margin: 12px 0 26px;
        font-weight: 500;
    }
    .subtitle i { color: var(--gold-2); margin-right: 4px; }
    .pro-form .input-group {
        position: relative; margin-bottom: 14px;
    }
    .pro-form .input-group i.field-icon {
        position: absolute; left: 16px; top: 50%;
        transform: translateY(-50%);
        color: var(--gold-3); font-size: 15px;
        pointer-events: none; transition: color 0.2s;
    }
    .pro-form input {
        width: 100%;
        padding: 15px 18px 15px 46px;
        background: rgba(0, 0, 0, 0.35);
        border: 1px solid var(--line-gold);
        border-radius: 12px;
        color: var(--text-1);
        font-size: 15px;
        font-weight: 500;
        transition: all 0.3s;
    }
    .pro-form input::placeholder { color: var(--text-3); }
    .pro-form input:focus {
        outline: none;
        border-color: var(--gold-2);
        background: rgba(0, 0, 0, 0.5);
        box-shadow: 0 0 0 3px rgba(251, 191, 36, 0.15),
                    0 0 25px rgba(251, 191, 36, 0.25);
    }
    .pro-form input:focus + i.field-icon,
    .pro-form .input-group:focus-within i.field-icon {
        color: var(--gold-1);
    }
    .btn-primary {
        width: 100%;
        padding: 15px;
        border: none;
        border-radius: 12px;
        background: linear-gradient(135deg, var(--gold-1), var(--gold-2) 50%, var(--gold-3));
        color: #1a1408;
        font-weight: 800;
        font-size: 15px;
        letter-spacing: 1px;
        text-transform: uppercase;
        cursor: pointer;
        transition: all 0.3s;
        display: flex; align-items: center; justify-content: center;
        gap: 10px;
        box-shadow: 0 8px 24px rgba(251, 191, 36, 0.25);
        margin-top: 8px;
    }
    .btn-primary:hover {
        transform: translateY(-2px);
        box-shadow: 0 12px 32px rgba(251, 191, 36, 0.4);
    }
    .btn-primary:active { transform: translateY(0); }
    .alert {
        padding: 12px 16px;
        border-radius: 10px;
        margin-bottom: 18px;
        font-size: 13px;
        font-weight: 600;
        display: flex; align-items: center; gap: 10px;
        background: rgba(251, 113, 133, 0.12);
        color: #fb7185;
        border-left: 4px solid #fb7185;
        text-align: left;
    }
    .login-footer {
        display: flex; justify-content: space-between; align-items: center;
        margin-top: 26px;
        padding-top: 20px;
        border-top: 1px dashed var(--line-gold);
        font-size: 10.5px;
        color: var(--text-3);
        font-weight: 600;
        letter-spacing: 0.5px;
    }
    .login-footer span { display: flex; align-items: center; gap: 5px; }
    .login-footer i { color: var(--gold-2); }
    .credit {
        margin-top: 18px;
        font-size: 10px;
        color: var(--text-3);
        letter-spacing: 2px;
        text-transform: uppercase;
    }
    .credit b {
        color: var(--gold-2);
        font-weight: 800;
    }
    @media (max-width: 420px) {
        .login-box { padding: 32px 22px; border-radius: 20px; }
        .brand-logo { font-size: 30px; }
        .brand-logo span { font-size: 18px; letter-spacing: 5px; }
        .subtitle { font-size: 12px; margin: 10px 0 22px; }
        .pro-form input { padding: 13px 16px 13px 42px; font-size: 14px; }
        .login-footer { font-size: 9.5px; }
    }
</style>
</head>
<body>
<div class="bg-grid"></div>
<canvas id="bgParticles"></canvas>
<div class="aurora"></div>

<div class="login-box">
    <div class="brand-badge">
        <i class="fa-solid fa-crown"></i> PREMIUM PANEL
    </div>
    <h1 class="brand-logo">
        MASTER
        <span>HOSTING</span>
    </h1>
    <p class="subtitle">
        <i class="fa-solid fa-bolt"></i>
        Unlimited servers · Premium speed · Free forever
    </p>

    {% if error %}
    <div class="alert">
        <i class="fa-solid fa-circle-exclamation"></i>
        {{ error }}
    </div>
    {% endif %}
    {% with msgs = get_flashed_messages(with_categories=true) %}
      {% for cat, msg in msgs %}
        <div class="alert">
            <i class="fa-solid fa-circle-exclamation"></i>
            {{ msg }}
        </div>
      {% endfor %}
    {% endwith %}

    <form method="POST" class="pro-form">
        <div class="input-group">
            <i class="fa-solid fa-user field-icon"></i>
            <input type="text" name="username" placeholder="Enter username"
                   required minlength="3" autocomplete="username"
                   autocapitalize="none" spellcheck="false" autofocus>
        </div>
        <button type="submit" class="btn-primary">
            Access Dashboard <i class="fa-solid fa-arrow-right"></i>
        </button>
    </form>

    <div class="login-footer">
        <span><i class="fa-solid fa-shield-halved"></i> Secure Session</span>
        <span><i class="fa-solid fa-infinity"></i> Unlimited</span>
    </div>

    <div class="credit">
        Powered by <b>MASTER HOSTING</b>
    </div>
</div>

<script>
(function(){
    var canvas = document.getElementById('bgParticles'); if(!canvas) return;
    var ctx = canvas.getContext('2d'); var w, h, particles = [];
    function resize(){ w = canvas.width = innerWidth; h = canvas.height = innerHeight; }
    resize(); addEventListener('resize', resize);
    var count = innerWidth < 600 ? 25 : 45;
    for(var i = 0; i < count; i++){
        particles.push({
            x: Math.random()*w, y: Math.random()*h,
            r: Math.random()*1.6 + 0.3,
            vx: (Math.random()-0.5)*0.3,
            vy: (Math.random()-0.5)*0.3,
            a: Math.random()*0.5 + 0.1
        });
    }
    function draw(){
        ctx.clearRect(0, 0, w, h);
        ctx.fillStyle = '#fbbf24';
        for(var i = 0; i < particles.length; i++){
            var p = particles[i];
            p.x += p.vx; p.y += p.vy;
            if(p.x < 0 || p.x > w) p.vx *= -1;
            if(p.y < 0 || p.y > h) p.vy *= -1;
            ctx.globalAlpha = p.a;
            ctx.beginPath();
            ctx.arc(p.x, p.y, p.r, 0, Math.PI*2);
            ctx.fill();
        }
        ctx.globalAlpha = 1;
        requestAnimationFrame(draw);
    }
    draw();
})();
</script>
</body>
</html>
